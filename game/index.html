<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Aurora Harvest</title>
<meta name="description" content="Terbangkan lentera cahaya, kumpulkan orb, hindari awan badai. Game arcade aurora berbahasa Indonesia.">
<meta name="theme-color" content="#070a18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a18; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* On-screen touch controls: bottom-right, clear of the canvas HUD. */
  #touch-ui { position: fixed; right: 12px; bottom: 12px; z-index: 10; display: flex; gap: 8px; }
  #touch-ui button { width: 52px; height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,.28); background: rgba(20,26,48,.78); color: #f2f4ff; font-size: 24px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  #touch-ui button:active { background: rgba(55,200,232,.5); }
  #btn-pause { display: none; }
  /* Polite hint on the title screen when the phone is held upright. */
  #rotate-hint { display: none; position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); z-index: 10; background: rgba(20,26,48,.94); color: #f2f4ff; border: 1px solid #37c8e8; border-radius: 999px; padding: 9px 18px; font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; white-space: nowrap; pointer-events: none; }
  body[data-screen="title"].portrait #rotate-hint { display: block; }
</style>
</head>
<body>
<canvas id="game" aria-label="Aurora Harvest: terbangkan lentera cahaya, kumpulkan orb, hindari awan badai, capai skor 500"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="rotate-hint" role="note">&#128241; Putar HP ke landscape untuk layar yang lebih luas</div>
<div id="touch-ui">
  <button id="btn-mute" type="button" aria-label="Matikan suara">&#128266;</button>
  <button id="btn-pause" type="button" aria-label="Jeda">&#9208;</button>
</div>
<script>
  // Offline play: cache the game's own files on first visit.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
